plugins {
    id "com.android.application"
}

android {
    namespace "net.polze.adolarradio"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // Keep Adolar Next independently installable alongside the existing
        // Adolar Radio app. The Java namespace intentionally stays stable
        // while the new product is developed.
        applicationId "net.polze.adolarnext"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "0.1.2-next"

        // Supply these through ~/.gradle/gradle.properties or CI secrets. The
        // Last.fm protocol requires the shared secret on native clients.
        def lastFmKey = providers.gradleProperty("LASTFM_API_KEY")
                .orElse(providers.environmentVariable("LASTFM_API_KEY")).getOrElse("")
        def lastFmSecret = providers.gradleProperty("LASTFM_SHARED_SECRET")
                .orElse(providers.environmentVariable("LASTFM_SHARED_SECRET")).getOrElse("")
        buildConfigField "String", "LASTFM_API_KEY", "\"${lastFmKey}\""
        buildConfigField "String", "LASTFM_SHARED_SECRET", "\"${lastFmSecret}\""

        // Optional second, mutually-exclusive scrobble destination: a
        // self-hosted Adolar Scrobbler instance (last.fm 2.0-compatible,
        // https://github.com/noyse27/adolar-scrobbler). API_ROOT is that
        // instance's own 2.0 Web Service URL, not a fixed constant like
        // Last.fm's, since it points at whichever instance the admin runs.
        def adolarScrobblerRoot = providers.gradleProperty("ADOLAR_SCROBBLER_API_ROOT")
                .orElse(providers.environmentVariable("ADOLAR_SCROBBLER_API_ROOT")).getOrElse("")
        def adolarScrobblerKey = providers.gradleProperty("ADOLAR_SCROBBLER_API_KEY")
                .orElse(providers.environmentVariable("ADOLAR_SCROBBLER_API_KEY")).getOrElse("")
        def adolarScrobblerSecret = providers.gradleProperty("ADOLAR_SCROBBLER_SHARED_SECRET")
                .orElse(providers.environmentVariable("ADOLAR_SCROBBLER_SHARED_SECRET")).getOrElse("")
        buildConfigField "String", "ADOLAR_SCROBBLER_API_ROOT", "\"${adolarScrobblerRoot}\""
        buildConfigField "String", "ADOLAR_SCROBBLER_API_KEY", "\"${adolarScrobblerKey}\""
        buildConfigField "String", "ADOLAR_SCROBBLER_SHARED_SECRET", "\"${adolarScrobblerSecret}\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.media:media:1.8.0"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.room:room-runtime:2.8.5"
    annotationProcessor "androidx.room:room-compiler:2.8.5"
    implementation "androidx.work:work-runtime:2.12.0"
    // Keystore-backed storage for the Android device sync token (see
    // local/DeviceTokenStore.java).
    implementation "androidx.security:security-crypto:1.1.0"
    // 1.9.4 is the newest stable Media3 line compatible with this app's API 35 toolchain.
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-common:1.11.1"
    implementation "androidx.media3:media3-datasource:1.11.1"
    implementation "androidx.media3:media3-database:1.11.1"
}
